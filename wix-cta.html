<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start Web Programmer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      a.cta {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 12px 22px 12px 12px;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(180deg, #f06a14 0%, #e85d04 100%);
        border-radius: 999px;
        box-shadow:
          0 10px 28px rgba(232, 93, 4, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      a.cta:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
        box-shadow:
          0 14px 32px rgba(232, 93, 4, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      a.cta:active {
        transform: translateY(0);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(12, 16, 20, 0.22);
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: 15px;
      }
      .copy {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        text-align: left;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
      }
      .sub {
        margin-top: 3px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <a
      class="cta"
      href="https://scorpiopraxis.github.io/DtronicsWebProgrammer/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="mark" aria-hidden="true">DT</span>
      <span class="copy">
        <span class="title">Start Web Programmer</span>
        <span class="sub">Chrome or Edge · no install</span>
      </span>
    </a>
  </body>
</html>
